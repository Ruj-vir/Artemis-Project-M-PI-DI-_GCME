<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Artemis — Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── Header ─────────────────────────────────────────────────────────── */
        .artemis-header {
            background-color: #2b5797;
            color: white;
            padding: 0 24px;
            height: 54px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .artemis-brand { font-size: 24px; font-weight: 700; letter-spacing: 1px; }

        /* ─── Center Card ─────────────────────────────────────────────────────── */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 52px 48px 44px;
            width: 380px;
            text-align: center;
        }

        .login-logo img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
            color: #2b5797;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 36px;
        }

        .btn-sso {
            background-color: #2b5797;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px 0;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
        }
        .btn-sso:hover  { background-color: #1e3f6f; color: white; }
        .btn-sso:active { transform: scale(0.98); }

        .login-footer {
            margin-top: 28px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="artemis-header">
        <span class="artemis-brand">ARTEMIS</span>
    </header>

    <!-- Login Card -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="/static/images/Logo_artemis.png" alt="Artemis Logo">
            </div>
            <div class="login-title">ARTEMIS</div>
            <div class="login-subtitle">Corrosion Management System</div>

            <a href="/login" class="btn-sso">
                <i class="fa-solid fa-right-to-bracket"></i>
                Log in with SSO
            </a>

            <div class="login-footer">
                ระบบนี้ใช้การยืนยันตัวตนผ่าน GCME SSO
            </div>
        </div>
    </div>

</body>
</html>
