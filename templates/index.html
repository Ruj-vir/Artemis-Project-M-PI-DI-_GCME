<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Engineering Excel Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-container {
            max-height: 70vh;
            overflow-x: auto;
            overflow-y: auto;
            border: 1px solid #dee2e6;
        }
        table thead th {
            position: sticky;
            top: 0;
            background-color: #212529 !important;
            color: white;
            white-space: nowrap;
            z-index: 10;
        }
        td { white-space: nowrap; font-size: 0.85rem; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-5">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h3 class="card-title">นำเข้าข้อมูล </h3>
                <form action="/upload" method="post" enctype="multipart/form-data" class="row g-3">
                    <div class="col-auto">
                        <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">ประมวลผลข้อมูล</button>
                    </div>
                </form>
            </div>
        </div>

        {% if data %}
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">ข้อมูลที่พบทั้งหมด: {{ total }} รายการ</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-bordered table-striped">
                        <thead class="table-dark">
                            <tr>
                                {% for header in headers %}
                                <th>{{ header }}</th>
                                {% endfor %}
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in data %}
                            <tr>
                                {% for header in headers %}
                                <td>{{ row[header] }}</td>
                                {% endfor %}
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
    {# <p>กำลังแสดงข้อมูลของโรงงาน: <strong>{{ data[9]['Tag'] }}</strong></p> #}
</body>
</html>
