services:
  artemis:
    image: artemis:local
    build: .
    container_name: artemis_app
    expose:
      - "8000"
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-artemis-secret-key-change-in-production}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login-page', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: docker.io/library/nginx:stable-alpine
    container_name: artemis_nginx
    ports:
      - "8005:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      artemis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login-page" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
